<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img"
     aria-label="anon-tool — deterministic, local anonymization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151f21"/>
      <stop offset="1" stop-color="#0d1416"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38c2ae"/>
      <stop offset="1" stop-color="#15807b"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4faf9"/>
      <stop offset="0.55" stop-color="#e2f2ef"/>
      <stop offset="1" stop-color="#9fdcd1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fb6a4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fb6a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a44e" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e0a44e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#7fd8cc" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="260" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#dots)"/>
    <ellipse cx="150" cy="35" rx="380" ry="255" fill="url(#glow1)"/>
    <ellipse cx="1055" cy="245" rx="420" ry="280" fill="url(#glow2)"/>
  </g>

  <!-- The mark: brackets around a filled dot — a placeholder. The value is gone; the token is
       what a model is allowed to see. -->
  <g transform="translate(70 76)">
    <rect width="108" height="108" rx="28" fill="url(#mark)"/>
    <path d="M36 26 H22 V82 H36" fill="none" stroke="#f2fffd" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 26 H86 V82 H72" fill="none" stroke="#f2fffd" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="54" r="12" fill="#ffd79a"/>
  </g>

  <text x="228" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="url(#word)" letter-spacing="-1.5">anon-tool</text>
  <text x="231" y="170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" fill="#87a09b">Deterministic, local anonymization — no model ever sees the
original</text>

  <!-- A line of text with one span replaced: four neutral words, the identifying one tokenized. -->
  <g transform="translate(880 96)">
    <rect x="0"   y="0"   width="86"  height="16" rx="8" fill="#2fb6a4" fill-opacity="0.26"/>
    <rect x="96"  y="0"   width="52"  height="16" rx="8" fill="#2fb6a4" fill-opacity="0.26"/>
    <rect x="158" y="0"   width="120" height="16" rx="8" fill="#e0a44e" fill-opacity="0.85"/>
    <rect x="0"   y="34"  width="64"  height="16" rx="8" fill="#2fb6a4" fill-opacity="0.26"/>
    <rect x="74"  y="34"  width="132" height="16" rx="8" fill="#2fb6a4" fill-opacity="0.26"/>
    <rect x="0"   y="68"  width="110" height="16" rx="8" fill="#2fb6a4" fill-opacity="0.26"/>
    <rect x="120" y="68"  width="94"  height="16" rx="8" fill="#2fb6a4" fill-opacity="0.26"/>
    <!-- the same three lines after redaction: the amber span is now a token, and the original is
         marked by the small bracketed glyph, not by its content -->
    <g transform="translate(252, -2)">
      <path d="M8 20 H2 V52 H8" fill="none" stroke="#7fd8cc" stroke-width="4" stroke-linecap="round"/>
      <path d="M20 20 H26 V52 H20" fill="none" stroke="#7fd8cc" stroke-width="4" stroke-linecap="round"/>
      <circle cx="14" cy="36" r="5" fill="#ffd79a"/>
    </g>
  </g>
</svg>
