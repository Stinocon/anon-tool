name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The converter is optional for the engine and required for the docx/pdf tests.
      # A failure to install must not silence the suite: those tests skip themselves when it is
      # missing, and the run stays honest about what it did not exercise. Installed through the
      # hashed pin, exactly like the image and the native venv (a version pin alone would let the
      # CI run a different wheel than the one the container ships).
      - name: Install the document converter
        run: pip install --require-hashes -r requirements-anydoc.txt || echo "converter unavailable — its tests will skip"

      - name: Engine suite
        run: python3 tests/test_anon.py

      - name: Web UI integration
        run: python3 tests/test_web.py

      - name: UI loads without throwing
        run: node tests/ui_load_check.mjs
